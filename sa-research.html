<script>
/* SA-Research — 4 live strategy equity curves scrolling right */
(function () {
  const hero   = document.querySelector('.week-hero');
  const canvas = document.getElementById('sa-canvas');
  const ctx    = canvas.getContext('2d');
  let W, H;

  const N      = 700;
  const DRIFTS = [0.003, 0.0015, 0.0022, 0.001];
  const ALPHAS = [0.55,  0.38,   0.45,   0.30 ];
  const WIDTHS = [1.8,   1.1,    1.5,    0.9  ];
  const curves = [];

  function makeCurve(idx) {
    const pts = new Float32Array(N);
    let y = 0.35 + (Math.random() - 0.5) * 0.2;
    pts[0] = y;
    for (let i = 1; i < N; i++) {
      y = Math.max(0.08, Math.min(0.92, y + (Math.random() - 0.5 + DRIFTS[idx]) * 0.016));
      pts[i] = y;
    }
    return { pts, progress: 0, alpha: 0, maxAlpha: ALPHAS[idx], speed: 0.00032 + Math.random() * 0.00018, lw: WIDTHS[idx], idx };
  }

  function initCurves() {
    curves.length = 0;
    for (let i = 0; i < 4; i++) {
      const c = makeCurve(i);
      c.progress = 0.15 + i * 0.22;
      c.alpha    = ALPHAS[i];
      curves.push(c);
    }
  }

  function resize() {
    const r = hero.getBoundingClientRect();
    W = canvas.width  = Math.round(r.width);
    H = canvas.height = Math.round(r.height);
    initCurves();
  }

  let lastTs = null;

  function frame(ts) {
    if (lastTs === null) lastTs = ts;
    const dt = Math.min(ts - lastTs, 40);
    lastTs = ts;

    ctx.clearRect(0, 0, W, H);

    for (const c of curves) {
      c.progress = Math.min(1, c.progress + c.speed * dt);
      if (c.progress >= 1) {
        const nc    = makeCurve(c.idx);
        nc.alpha    = c.maxAlpha;
        nc.lw       = c.lw;
        nc.idx      = c.idx;
        Object.assign(c, nc);
      }
      const vis = Math.max(2, Math.floor(c.progress * W));
      ctx.beginPath();
      ctx.lineWidth   = c.lw;
      ctx.strokeStyle = `rgba(255,125,42,${c.alpha.toFixed(2)})`;
      for (let i = 0; i < vis; i++) {
        const x  = (i / (W - 1)) * W;
        const yi = Math.floor((i / (W - 1)) * (N - 1));
        i === 0 ? ctx.moveTo(x, c.pts[yi] * H) : ctx.lineTo(x, c.pts[yi] * H);
      }
      ctx.stroke();
    }

    requestAnimationFrame(frame);
  }

  new ResizeObserver(resize).observe(hero);
  resize();
  requestAnimationFrame(frame);
})();
</script>
