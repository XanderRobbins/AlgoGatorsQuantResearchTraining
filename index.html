<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlgoGators — Training Hub</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="Delta.png">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #141416;
    }

    .landing-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem 5rem;
      position: relative;
      background:
        radial-gradient(ellipse 70% 55% at 50% 42%, rgba(255, 92, 0, 0.08) 0%, transparent 70%),
        #141416;
    }

    /* Hairline orange rule across the very top */
    .landing-hero::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: #FF5C00;
    }

    @property --p1 { syntax: '<percentage>'; initial-value: 50%; inherits: false; }
    @property --p2 { syntax: '<percentage>'; initial-value: 50%; inherits: false; }

    @keyframes pulse-split {
      0%   { --p1: 50%; --p2: 50%; }
      20%  { --p1: 0%;  --p2: 100%; }
      70%  { --p1: 0%;  --p2: 100%; }
      90%  { --p1: 50%; --p2: 50%; }
      100% { --p1: 50%; --p2: 50%; }
    }

    /* Pulsing line at the bottom */
    .landing-hero::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0; right: 0;
      height: 2px;
      background:
        radial-gradient(ellipse 120px 100% at var(--p1) 50%, rgba(255,255,255,0.95), transparent),
        radial-gradient(ellipse 120px 100% at var(--p2) 50%, rgba(255,255,255,0.95), transparent),
        rgba(255, 255, 255, 0.18);
      animation: pulse-split 10s ease-in-out infinite;
    }

    /* ── Logo ─────────────────────────────────────────────────────── */
    .landing-logo-wrap {
      margin-bottom: 3rem;
    }

    .landing-logo {
      border-radius: 14px;
      display: block;
      opacity: 0.92;
      outline: 3px solid rgba(255, 255, 255, 0.75);
      outline-offset: 12px;
    }

    /* ── Text ─────────────────────────────────────────────────────── */
    .landing-title {
      font-family: 'Poppins', sans-serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.02em;
      margin: 0 0 0.7rem;
      border: none;
      display: block;
      text-align: center;
    }

    .landing-prompt {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: rgba(255, 92, 0, 0.55);
      margin: 0 0 3.5rem;
    }

    /* ── Path cards ───────────────────────────────────────────────── */
    .path-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      width: 100%;
      max-width: 580px;
    }

    @property --shine-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    @keyframes card-shine {
      to { --shine-angle: 360deg; }
    }

    .path-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 1.75rem 2rem;
      border: 1px solid rgba(255, 92, 0, 0.2);
      border-radius: 6px;
      background: rgba(255, 92, 0, 0.04);
      text-decoration: none;
      position: relative;
      transition: border-color 0.2s, background 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .path-card::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: conic-gradient(
        from var(--shine-angle),
        transparent 0%,
        transparent 40%,
        rgba(255, 255, 255, 0.55) 50%,
        transparent 60%,
        transparent 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: card-shine 6s linear infinite;
      pointer-events: none;
    }

    .path-card:hover {
      border-color: rgba(255, 92, 0, 0.55);
      background: rgba(255, 92, 0, 0.08);
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }

    .path-card-label {
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: #FFFFFF;
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }

    .path-card-desc {
      font-family: 'Open Sans', sans-serif;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.42);
      line-height: 1.6;
      margin: 0;
    }

    .path-card-arrow {
      margin-top: 1.5rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      color: rgba(255, 92, 0, 0.45);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color 0.2s, transform 0.2s;
    }

    .path-card:hover .path-card-arrow {
      color: rgba(255, 92, 0, 0.9);
      transform: translateX(4px);
    }

    /* ── Footer ───────────────────────────────────────────────────── */
    .landing-footer {
      background: #0D0E10;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding: 1.5rem 2rem;
      text-align: center;
      color: rgba(255, 255, 255, 0.18);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      font-family: 'IBM Plex Mono', monospace;
    }

    @media (max-width: 540px) {
      .path-grid     { grid-template-columns: 1fr; }
      .landing-title { font-size: 2rem; }
    }
  </style>
</head>
<body>

<div class="landing-hero">
  <div class="landing-logo-wrap">
    <img src="Long.png" alt="AlgoGators" class="landing-logo" style="max-width:451px; height:auto;">
  </div>

  <h1 class="landing-title">AlgoGators Training</h1>
  <p class="landing-prompt">Select your path to continue</p>

  <div class="path-grid">
    <a href="senior-analyst.html" class="path-card">
      <div class="path-card-label">Senior Analyst</div>
      <p class="path-card-desc">Senior resources and advanced team content.</p>
      <div class="path-card-arrow">Enter →</div>
    </a>
    <a href="new-analyst.html" class="path-card">
      <div class="path-card-label">New Analyst</div>
      <p class="path-card-desc">10-week onboarding program across all teams.</p>
      <div class="path-card-arrow">Enter →</div>
    </a>
  </div>
</div>

<div class="landing-footer">
  AlgoGators Investment Fund &nbsp;//&nbsp; Internal Use Only
</div>

<script src="cursor.js"></script>
</body>
</html>
